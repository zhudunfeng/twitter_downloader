version: "1.0"
name: 构建与发布
displayName: 构建与发布
stages:
- name: 校验与构建
  displayName: 校验与构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@python
    name: build_application
    displayName: 安装依赖并构建应用
    pythonVersion: "3.10"
    commands:
    - set -e
    - python --version
    - python -m pip --version
    - python -m pip config set global.index-url https://mirrors.aliyun.com/pypi/simple/
    - python -m pip install --upgrade pip
    - python -c "from pathlib import Path; Path('ci-requirements.txt').write_text(''.join(line for line in Path('requirements.txt').read_text(encoding='utf-8').splitlines(keepends=True) if not line.startswith('yt-dlp==')), encoding='utf-8')"
    - python -m pip install -r ci-requirements.txt
    - python -m pip install yt-dlp==2026.7.4
    - python -m pip install pyinstaller==6.22.0
    - python -m pip check
    - python -m compileall -q twitter_downloader gui_launcher.py
    - python -m twitter_downloader --help
    - python -m PyInstaller --noconfirm --clean --noconsole --onedir --name TwitterDownloader
      --paths . --distpath ci-dist --workpath ci-work --specpath ci-spec gui_launcher.py
    artifacts:
    - name: TWITTER_DOWNLOADER_APP
      path:
      - ./ci-dist/TwitterDownloader
      type: .zip
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 上传制品
  displayName: 上传制品
  strategy: naturally
  trigger: auto
  steps:
  - step: publish@general_artifacts
    name: publish_application
    displayName: 上传应用压缩包
    dependArtifact: TWITTER_DOWNLOADER_APP
    artifactName: twitter-downloader
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 发布版本
  displayName: 发布版本
  strategy: naturally
  trigger: manual
  steps:
  - step: publish@release_artifacts
    name: release_application
    displayName: 发布应用版本
    dependArtifact: twitter-downloader
    version: 0.1.0
    autoIncrement: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
