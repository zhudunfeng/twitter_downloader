version: "1.0"
name: 测试、构建与发布
displayName: 测试、构建与发布

stages:
- name: 校验与构建
  displayName: 校验与构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@python
    name: build_application
    displayName: 安装依赖、测试并构建应用
    pythonVersion: "3.14"
    commands:
    - python --version
    - python -m pip --version
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    - python -m pip install pyinstaller==6.22.0
    - python -m unittest discover -s tests -p 'test*.py' -v
    - python -m compileall -q twitter_downloader gui_launcher.py
    - python -m twitter_downloader --help
    - python -m PyInstaller --noconfirm --clean --noconsole --onedir --name TwitterDownloader --paths . --distpath ci-dist --workpath ci-work --specpath ci-spec gui_launcher.py
    artifacts:
    - name: TWITTER_DOWNLOADER_APP
      path:
      - ./ci-dist/TwitterDownloader
      type: .zip
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"

- name: 上传制品
  displayName: 上传制品
  strategy: naturally
  trigger: auto
  steps:
  - step: publish@general_artifacts
    name: publish_application
    displayName: 上传应用压缩包
    dependArtifact: TWITTER_DOWNLOADER_APP
    artifactName: twitter-downloader
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"

- name: 发布版本
  displayName: 发布版本
  strategy: naturally
  trigger: manual
  steps:
  - step: publish@release_artifacts
    name: release_application
    displayName: 发布应用版本
    dependArtifact: twitter-downloader
    version: "0.1.0"
    autoIncrement: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"

triggers:
  trigger: auto

notify: []

strategy:
  blocking: true
