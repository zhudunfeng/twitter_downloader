name: Build Desktop Applications

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows

    env:
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip --version
          python -m pip install --upgrade pip
          python -c "from pathlib import Path; source=Path('requirements.txt'); target=Path('ci-requirements.txt'); target.write_text(''.join(line for line in source.read_text(encoding='utf-8').splitlines(keepends=True) if not line.startswith('yt-dlp==')), encoding='utf-8')"
          python -m pip install -r ci-requirements.txt
          python -m pip install yt-dlp==2026.7.4 pyinstaller==6.22.0
          python -m pip check

      - name: Compile sources
        shell: bash
        run: python -m compileall -q twitter_downloader gui_launcher.py

      - name: Build application
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --noconsole \
            --onedir \
            --name TwitterDownloader \
            --paths . \
            --distpath dist \
            --workpath ci-work \
            --specpath ci-spec \
            gui_launcher.py

      - name: Upload ${{ matrix.target }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitter-downloader-${{ matrix.target }}
          path: dist/TwitterDownloader
          if-no-files-found: error
